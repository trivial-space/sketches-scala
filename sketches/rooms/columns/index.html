<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rooms/columns — sketch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <script type="module">
    if (new URLSearchParams(location.search).has("debug")) {
      await new Promise((resolve, reject) => {
        const s = document.createElement("script")
        s.src = "https://cdn.jsdelivr.net/npm/eruda@3.4.1/eruda.js"
        s.onload = resolve
        s.onerror = reject
        document.head.appendChild(s)
      })
      eruda.init()
      eruda.show()

      if (!navigator.gpu) console.error("WebGPU not available")
      else {
        const requestDevice = GPUAdapter.prototype.requestDevice
        GPUAdapter.prototype.requestDevice = async function (...args) {
          const device = await requestDevice.apply(this, args)
          device.lost.then((info) =>
            console.error(`GPU device lost (${info.reason}): ${info.message}`),
          )
          device.addEventListener("uncapturederror", (e) =>
            console.error(`GPU error: ${e.error.message}`),
          )
          return device
        }
      }
    }

    const { sketch } = await import("./main.js")
    sketch(document.getElementById("canvas"))
  </script>
</body>

</html>
